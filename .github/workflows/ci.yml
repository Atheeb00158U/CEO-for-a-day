name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Node runs this .mjs against src/lib/*.ts directly, so it checks TypeScript stripping still works.
      - run: node scripts/treemap.mjs kodak > /dev/null
      - run: npm run build
