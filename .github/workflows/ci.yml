name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Runs through Node against src/lib/*.ts directly, so it also checks TypeScript stripping still works.
      - run: npm run hotseat:check
      - run: npm run build
      # No answer may reach the browser: the phone gets each verdict from /api/play only after a pick.
      - run: node scripts/check-bundle.mjs
